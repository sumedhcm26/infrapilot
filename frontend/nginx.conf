# nginx.conf - SPA (Single Page Application) routing config
# This tells nginx to serve index.html for ALL routes
# so React Router can handle client-side navigation

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # For all routes: serve index.html (React Router handles the rest)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api calls to the backend
    # Useful if you deploy frontend and backend on the same server
    # location /api {
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
